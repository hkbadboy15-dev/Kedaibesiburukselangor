<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kedai Besi Buruk Selangor – Scrap Metal & Used Items</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0d0f;--card:#14171a;--ink:#f1eee8;--mute:#a0a4ab;--line:#262a2f;--hd:#08090a;--acc:#d6aa4c;--accb:#2a2415;color-scheme:dark;--gold:linear-gradient(135deg,#f2d27a,#c9972f 55%,#a8761a);
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;padding-bottom:92px}
.in{max-width:960px;margin:0 auto}
.hd{background:radial-gradient(900px 400px at 85% -10%,#3a2f14 0,transparent 60%),linear-gradient(180deg,#14171a,#0b0c0e);color:#fff;padding:14px 18px 34px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid #c9972f55}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;letter-spacing:.6px;font-size:15px}
.logo img{width:40px;height:40px;border-radius:50%;flex:none}.logo i{width:32px;height:32px;border-radius:9px;background:var(--gold);display:grid;place-items:center;font-style:normal;color:#1a1204;font-size:17px}
.lang{display:flex;border:1px solid #ffffff33;border-radius:99px;overflow:hidden}
.lang button{border:0;background:transparent;color:#e8e2d3;padding:6px 13px;font-weight:600;cursor:pointer;font-size:13px}
.lang button.on{background:var(--gold);color:#1a1204}
.hero{display:grid;gap:22px;align-items:center}
.banner{width:100%;display:block;border-radius:18px;border:1px solid #c9972f88;box-shadow:0 18px 44px #000b,0 0 0 4px #c9972f1f}
.badge{display:inline-block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#e7c675;border:1px solid #c9972f66;border-radius:99px;padding:5px 12px;margin-bottom:14px}
h1{font-family:var(--serif);font-size:clamp(30px,7vw,48px);line-height:1.1;margin:0 0 12px;font-weight:700}
h1 em{font-style:normal;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd p{color:#c4c0b6;margin:0 0 20px;max-width:520px;font-size:15px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:15px;font-family:var(--sans)}
.b.wa{background:linear-gradient(180deg,#22b455,#15803d);color:#fff;box-shadow:0 6px 18px #15803d55}
.b.gold{background:var(--gold);color:#1a1204;box-shadow:0 6px 18px #c9972f44}
.b.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.col{position:relative;height:250px}
.col img{position:absolute;width:46%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;border:1px solid #ffffff2a;box-shadow:0 14px 34px #000a}
.col img:nth-child(1){left:0;top:0;transform:rotate(-5deg)}
.col img:nth-child(2){right:0;top:22px;transform:rotate(5deg)}
.col img:nth-child(3){left:27%;bottom:0;transform:rotate(-1deg);z-index:2}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin:-18px auto 0;max-width:960px;position:relative;z-index:3}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}
.tr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 24px #0000001a}
.tr b{display:block;font-size:14px}.tr small{color:var(--mute);font-size:12px}.tr span{font-size:22px;display:block;margin-bottom:4px}
.sec{max-width:960px;margin:22px auto;padding:0 16px}.it .ph{border-bottom:1px solid var(--line)}input:focus,textarea:focus{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px #0000000d}
h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
h2:after{content:"";display:block;width:42px;height:3px;border-radius:3px;background:var(--gold);margin-top:8px}
.sub{color:var(--mute);font-size:13px;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 12px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.chips button.on{background:var(--gold);color:#1a1204;border-color:transparent;font-weight:700}
input[type=search],input[type=text],textarea{outline:0;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px}
.cnt{font-size:12px;color:var(--mute);margin:10px 0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.it{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit;transition:transform .15s,box-shadow .15s}
.it:hover{transform:translateY(-3px);box-shadow:0 12px 26px #00000026}
.it.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.ph{aspect-ratio:1/1;background:#e6f5f2}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tx{padding:10px 12px 12px}.tx small{display:block;color:var(--mute);font-size:11px;letter-spacing:.4px;text-transform:uppercase}.tx b{font-size:14px;display:block;margin-top:2px}
.tx span{display:inline-block;font-size:12px;color:var(--acc);font-weight:700;margin-top:6px}
.steps{display:grid;gap:12px}@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.st{display:flex;gap:12px}.st i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1204;font-style:normal;font-weight:800;display:grid;place-items:center;font-family:var(--serif)}
.st b{display:block}.st small{color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:5px}
.band{background:radial-gradient(600px 240px at 80% 0,#3a2f14,transparent 70%),#0e1012;color:#fff;border-radius:20px;padding:26px 20px;text-align:center;border:1px solid #c9972f55}
.band h2{display:inline-block;color:#fff}.band h2:after{margin:8px auto 0}.band p{color:#c4c0b6;margin:12px 0 18px}.band .cta{justify-content:center}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px 16px 20px}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{display:flex;gap:8px;align-items:center}.bar .n{flex:1;font-size:13px;font-weight:700}
</style>
</head>
